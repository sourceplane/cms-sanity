apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Sanity-backed blog and its embedded Studio (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # No dependsOn: the blog reads no wiring and binds nothing, so there is no
  # infra component to deploy before it. A component under infra/ that this
  # Worker comes to read wiring from goes here, `mode: enforced` with a
  # `modeRules` entry making it advisory on github-pull-request, so one
  # convergence applies it first.
  #
  # The Sanity project id and dataset: public values `next build` inlines into
  # the server and the Studio bundles, stored per environment as the product's
  # secrets SANITY_PROJECT_ID and SANITY_DATASET (README → Connecting Sanity).
  # BEST-EFFORT references, wire-now-seed-later: a key nobody has stored yet
  # is skipped when the job resolves its secrets (no env var, no failure), and
  # a build without a project id is the blog with its sample posts and a
  # "connect your Sanity project" notice — so a fresh product deploys and
  # serves before its owner has a Sanity project at all. The read token is
  # not here: it is read at request time, a Worker secret.
  optionalSecretEnv:
    NEXT_PUBLIC_SANITY_PROJECT_ID: "secret://cms-sanity/cms-sanity/{{ .environment }}/SANITY_PROJECT_ID"
    NEXT_PUBLIC_SANITY_DATASET: "secret://cms-sanity/cms-sanity/{{ .environment }}/SANITY_DATASET"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: cms-sanity-web-{dev,stage,prod}.
    workerName: cms-sanity-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders the blog's layout (its <html> classes —
    # not the blog's name, which is the owner's to change and HTML-escaped
    # when it carries an `&` or `'`), whether it shows sample posts or the
    # owner's; and the draft-mode route, which only the Worker's server code
    # answers, refuses a request without a preview secret (401), with or
    # without a project and a read token. The page is buffered before grep so
    # an early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'bg-white text-black' && test \"$(curl -s -o /dev/null -w '%{http_code}' \"${DEPLOYED_URL}/api/draft-mode/enable\")\" = 401"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
