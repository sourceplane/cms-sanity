apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Sanity-backed blog and its embedded Studio (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # The Sanity project id and dataset are build-time public values: `next
  # build` inlines them into the server and the Studio bundles. The deploy
  # build exports them from the product's secrets; the read token is not here
  # — it is a Worker secret (README → Deploying).
  secretEnv:
    NEXT_PUBLIC_SANITY_PROJECT_ID: "secret://cms-sanity/cms-sanity/{{ .environment }}/SANITY_PROJECT_ID"
    NEXT_PUBLIC_SANITY_DATASET: "secret://cms-sanity/cms-sanity/{{ .environment }}/SANITY_DATASET"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: cms-sanity-web-{dev,stage,prod}.
    workerName: cms-sanity-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders and carries the app's marker text.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'bg-white text-black'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
