apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: CS-7
  title: "The domain is set later"
spec:
  goal: "The console no longer asks for the blog's domain. A blog goes live on workers.dev; productdomain is an optional build input (default empty), the rebrand writes the reserved placeholder <reponame>.example.com where the domain goes (BASE_DOMAIN in intent.yaml), and the blog's README says how an owner replaces it once a domain is attached"
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - tooling/rebrand/rebrand.mjs
    - testing/rebrand.test.sh
    - testing/fixtures/acme.json
    - .github/workflows/baseline.yml
    - .baseline/product/README.md
    - BOOTSTRAP.md
    - README.md
    - docs/phases/README.md
    - ai/context/operations.md
    - ai/context/current.md
    - ai/context/decisions.md
    - specs/**
    - tasks/**
  doneWhen:
    - blueprint.yaml declares no productdomain input, and repo-blueprint.yaml's productdomain is optional with an empty default
    - "rebrand.mjs no longer requires productdomain and brands <reponame>.example.com when it is empty, including for a slug whose placeholder contains the baseline's own (testing/rebrand.test.sh)"
    - testing/fixtures/acme.json carries no domain, so the leak gate and the offline bootstrap exercise what a console build supplies
    - the contract tests, the docs check, the leak gate and the offline bootstrap are green
  gates:
    - checks
